<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento</title>
</head>

<body>

    <form action="#" method="post">
        <fieldset>
            <legend>Formulário de Orçamento</legend>
            <label for="Campo_nome">Nome Completo:</label>
            <input type="text" id="Campo_nome" name="nome" minlength="5" maxlength="30" required
                placeholder="Nome completo">
            <br /> <br />
            <label for="Campo_email">E-mail:</label>
            <input type="email" id="Campo_email" name="email" minlength="5" maxlength="30" required
                placeholder="Seu email">
            <br /> <br />
            <label for="cel">Telefone:</label>
            <input type="tel" id="cel" name="telefone" maxlength="11" required placeholder="Seu número com DDD">
            <br /> <br />
            <label for="usuario_viagem">Escolha a sua viagem:</label>
            <select id="usuario_viagem" name="viagem" required>
                <option value="">Escolha...</option>
                <option value="AL">Maceió/Alagoas</option>
                <option value="RJ">Paraty/Rio de Janeiro</option>
                <option value="PE">Recife/Pernambuco</option>
            </select><br /> <br />
            <button type="submit">Enviar</button>
        </fieldset>
    </form>
    <br />
    <a href="index.html">Voltar</a>

</body>

</html>
